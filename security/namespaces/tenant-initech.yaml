apiVersion: v1
kind: Namespace
metadata:
  name: tenant-initech
  labels:
    pod-security.kubernetes.io/enforce: restricted
    tenant: initech
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: tenant-initech
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "20"
